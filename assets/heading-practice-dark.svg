<svg xmlns="http://www.w3.org/2000/svg" width="900" height="154" viewBox="0 0 900 154" role="img" aria-labelledby="t">
<title id="t">Practice: Practice, in public.</title>
<defs>
<style>
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Fraunces Italic';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.ink{fill:#ece7f5} .muted{fill:#9b92ad} .acc{fill:#b9a3e3} .dot{fill:#ff6a2a}
text{font-kerning:normal}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:1.6px}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) .15s both}
.rule{animation:draw 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:804}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rise,.rule{animation:none}}
</style>
</defs>
<text class="mono muted" x="48" y="30">(04) — PRACTICE</text>
<text class="mono muted" x="852" y="30" text-anchor="end">GITHUB · LEETCODE · DAILY</text>
<line class="rule" x1="48" x2="852" y1="48" y2="48" stroke="#ece7f5" stroke-opacity="0.18" stroke-dasharray="804"/>
<text x="45" y="126" class="rise" font-family="Fraunces" font-size="60" letter-spacing="-2.10"><tspan class="ink">Practice, </tspan><tspan class="acc" font-family="Fraunces Italic" letter-spacing="-1.20">in public</tspan><tspan class="dot">.</tspan></text>
</svg>
