<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="(01) About">
<defs><style>
@font-face{font-family:'Geist Mono';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Fraunces';src:url(data:font/woff2;base64,) format('woff2')}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-size:14px;letter-spacing:1.5px;fill:#6a6278}
.word{font-family:'Fraunces',Georgia,serif;font-size:58px;letter-spacing:-2.03px;fill:#1b1724;font-kerning:normal}
.dot{fill:#ff4f00}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.rule{animation:draw 1.1s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rise,.rule{animation:none}}
</style></defs>
<g class="rise">
<text class="num" x="348.6" y="38">(01)</text>
<text class="word" x="402.2" y="70">About<tspan class="dot">.</tspan></text>
</g>
<line class="rule" x1="390.0" x2="510.0" y1="86" y2="86" stroke="#1b1724" stroke-opacity="0.22" stroke-dasharray="120"/>
</svg>
